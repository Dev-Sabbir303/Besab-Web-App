:root{--bgA:#070b1f;--bgB:#161047;--tx:#eef3ff;--mu:#9aa8d6;--a:#7c5cff;--b:#2f8bff;--bolt:#ffe14d;--t1:#fff6b8;--t2:#ffc400;--red:#ff7a90;--grn:#4ade80;--card:rgba(28,24,102,.95);--nav:rgba(11,15,42,.96);--bd:rgba(124,140,255,.24);--key:rgba(124,140,255,.15);--bg1:rgba(99,102,241,.45);--bg2:rgba(34,211,238,.28);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme="light"]{--bgA:#e9f0ff;--bgB:#d4e0ff;--tx:#10173a;--mu:#5f6b99;--a:#5b3df5;--b:#1d6fe8;--bolt:#ffd21f;--t1:#5b3df5;--t2:#1d6fe8;--red:#d6334a;--grn:#14915b;--card:rgba(38,40,130,.95);--nav:rgba(255,255,255,.96);--bd:rgba(91,61,245,.18);--key:rgba(91,61,245,.09);--bg1:rgba(99,102,241,.25);--bg2:rgba(34,211,238,.2)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{min-height:100vh;background:var(--bgA);color:var(--tx);font-family:"Hind Siliguri","Noto Sans Bengali",system-ui,sans-serif;font-size:15.5px;line-height:1.4}
#app{max-width:520px;margin:0 auto;padding:12px 12px 104px}
button{font:inherit;color:inherit;cursor:pointer}
header{position:relative;text-align:center;margin:4px 2px 16px}
header .tg{position:absolute;right:0;top:0}
.b1{font-family:"SabAloe",Georgia,serif;font-size:38px;line-height:1.05;letter-spacing:3px;background:linear-gradient(135deg,var(--t1),var(--t2));-webkit-background-clip:text;background-clip:text;color:transparent;display:inline-block}
.b2{font-family:"SabBeauty",cursive,Georgia,serif;font-size:22px;line-height:1.2;margin-top:2px}
h1{font-size:22px;margin:0;font-weight:700}
h3{font-size:16px;margin:18px 2px 8px}
.mu{color:var(--mu);font-size:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:13px;margin-bottom:11px;box-shadow:0 4px 16px -8px rgba(0,0,0,.45)}
.hero{background:linear-gradient(135deg,rgba(124,140,255,.28),rgba(34,211,238,.16)),var(--card)}
.hn{font-size:31px;font-weight:700;line-height:1.25}
.tri{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.tri div{background:var(--key);border-radius:14px;padding:8px 10px}
.tri span{display:block;font-size:12px;color:var(--mu)}
.tri b{font-size:16px}
input[type=text],input[type=search],textarea{width:100%;padding:12px 14px;border:1px solid var(--bd);border-radius:14px;background:var(--key);color:var(--tx);font:inherit;margin-bottom:10px}
.bt{border:0;border-radius:14px;padding:11px;font-size:15px;font-weight:700;width:100%;color:#fff;background:linear-gradient(135deg,var(--a),var(--b));transition:transform .12s}
.bt:active,.pad button:active,.it:active{transform:scale(.94)}
.ghost{background:var(--key);color:var(--tx)}
.r2{background:var(--red)}.g2{background:var(--grn)}
.r{color:var(--red)}.g{color:var(--grn)}
.row{display:flex;align-items:center;gap:12px;padding:10px 2px;border-bottom:1px solid var(--bd);cursor:pointer}
.row:last-child{border:0}
.nm{flex:1;min-width:0}
.nm b,.nm div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.av{width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;overflow:hidden;flex:none}
.av img{width:100%;height:100%;object-fit:cover}
.top{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.ib{border:1px solid var(--bd);background:var(--card);border-radius:14px;width:44px;height:44px;font-size:20px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 12px}
.chips a,.chips button{border:1px solid var(--bd);background:var(--key);border-radius:999px;padding:6px 14px;font-size:14px;text-decoration:none;color:var(--tx)}
.disp{background:var(--key);border-radius:14px;padding:8px 12px;text-align:right;margin-bottom:8px;min-height:62px}
#dsp{font-size:24px;word-break:break-all;min-height:32px}
#res{color:var(--mu);font-size:15px}
.pad{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:10px}
.pad button{background:var(--key);border:0;border-radius:13px;padding:9px 0;font-size:18px;font-weight:600;transition:transform .1s}
.pad .op{background:linear-gradient(135deg,var(--a),var(--b));color:#fff}
.pad .w2{grid-column:span 2}
.acts,.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.two{grid-template-columns:2fr 1fr}
.h{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--bd)}
.h:last-child{border:0}
.h button{border:0;background:none;color:var(--mu);font-size:13px;padding:0}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px;margin-bottom:12px}
.it{position:relative;background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:11px 8px;display:flex;flex-direction:column;align-items:center;font-size:15px;transition:transform .12s}
.it b{color:var(--a);font-size:16px}
.it i{position:absolute;top:8px;right:10px;font-style:normal;background:linear-gradient(135deg,var(--a),var(--b));color:#fff;border-radius:999px;min-width:26px;padding:0 8px;font-size:13px;text-align:center}
.bump{animation:bp .35s}
@keyframes bp{40%{transform:scale(1.09)}}
.dn{text-decoration:line-through;color:var(--mu)}
.ck{justify-content:flex-start}
.ck span{flex:1}
.ck input{width:22px;height:22px;accent-color:var(--a)}
details summary{cursor:pointer;font-weight:600;margin-bottom:10px}
.fab{position:sticky;bottom:calc(92px + env(safe-area-inset-bottom,0px))}
nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(8px + env(safe-area-inset-bottom,0px));width:min(500px,calc(100% - 16px));display:grid;grid-template-columns:repeat(6,1fr);gap:4px;padding:6px;border-radius:22px;background:var(--nav);border:1px solid var(--bd);box-shadow:0 -2px 20px -6px rgba(90,110,255,.4);z-index:4}
nav button{border:0;border-radius:16px;background:none;color:var(--mu);display:flex;flex-direction:column;align-items:center;gap:1px;padding:6px 0 5px;font-size:10.5px;font-weight:600;transition:background .2s,color .2s,transform .15s}
nav button:active{transform:scale(.92)}
nav i{font-style:normal;font-size:19px;line-height:1.2}
nav span{display:block;white-space:nowrap}
nav .on{color:#1a1500;background:var(--bolt);box-shadow:0 0 14px -2px var(--bolt)}
#toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--tx);color:var(--bgA);padding:10px 18px;border-radius:14px;display:none;z-index:12;animation:bp .35s}
.it small{color:var(--mu);font-size:11.5px}.pi{width:46px;height:46px;border-radius:12px;object-fit:cover;margin-bottom:4px}.it i:empty{display:none}.ord{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}.ord span{background:var(--key);border-radius:999px;padding:2px 10px;font-size:13px}.two3{display:grid;grid-template-columns:1fr 1fr;gap:8px}
#bg{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none;background:linear-gradient(165deg,var(--bgA),var(--bgB))}
.gl{position:absolute;width:90vmax;height:90vmax;border-radius:50%;will-change:transform;animation:dr 16s ease-in-out infinite alternate}
.g1{left:-40vmax;top:-30vmax;background:radial-gradient(circle,var(--bg1),transparent 62%)}
.g2{right:-45vmax;bottom:-35vmax;background:radial-gradient(circle,var(--bg2),transparent 62%);animation-duration:21s;animation-direction:alternate-reverse}
@keyframes dr{to{transform:translate(12vmax,8vmax) scale(1.08)}}
.shop{position:absolute;inset:0;width:100%;height:100%;opacity:.5}.tw{animation:tw 2.4s ease-in-out infinite}.sm{animation:sm 3s ease-out infinite}
@keyframes tw{50%{opacity:.35}}@keyframes sm{0%{opacity:0;transform:translateY(8px)}50%{opacity:.6}100%{opacity:0;transform:translateY(-14px)}}
.card,.it{color:#fff;--tx:#fff;--mu:#b9c3ee;--key:rgba(255,255,255,.12);--bd:rgba(255,255,255,.16);--red:#ff8fa3;--grn:#5cf0a0}.ib{color:#fff}::placeholder{color:var(--mu);opacity:.85}
#md{position:fixed;inset:0;background:rgba(5,8,25,.65);display:none;align-items:center;justify-content:center;z-index:9;padding:20px}

<script>
const $=s=>document.querySelector(s);
const D0={c:[],s:[],x:[],l:[],pr:[],it:[{n:'চা',p:10},{n:'কফি',p:20},{n:'বিস্কুট',p:5},{n:'সিঙ্গারা',p:10}]};
let db=D0,tab='b',view=null,expr='',ph='',armed='',bump='',prev={},ord=[],pe='',pph='';
try{db=Object.assign({},D0,JSON.parse(localStorage.getItem('baki')))}catch(e){}
let sv;const wr=()=>{try{localStorage.setItem('baki',JSON.stringify(db))}catch(e){toast('জায়গা শেষ — ছোট ছবি দিন')}};const save=()=>{clearTimeout(sv);sv=setTimeout(wr,250)};addEventListener('pagehide',wr);document.addEventListener('visibilitychange',()=>{if(document.hidden)wr()});
const bn=n=>String(n).replace(/\d/g,d=>'০১২৩৪৫৬৭৮৯'[d]);
const money=n=>'৳ '+bn(Math.round(n*100)/100);
const sum=a=>a.reduce((s,x)=>s+x.a,0);
const bal=c=>c.t.reduce((s,t)=>s+(t.k=='b'?t.a:-t.a),0);
const fd=i=>new Date(i).toLocaleDateString('bn-BD',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
const ft=i=>new Date(i).toLocaleTimeString('bn-BD',{hour:'numeric',minute:'2-digit',hour12:true});
const td=d=>new Date(d).toDateString();
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const av=c=>`<div class="av" style="background:linear-gradient(135deg,hsl(${c.id%360} 70% 58%),hsl(${(c.id+60)%360} 70% 52%))">${c.p?`<img src="${c.p}" alt="">`:esc(c.n.trim().charAt(0))}</div>`;
const num=(id,v,c='')=>`<b id="${id}" class="${c}" data-n="${v}">${money(v)}</b>`;
let tt;function toast(m){const t=$('#toast');t.style.display='none';void t.offsetWidth;t.textContent=m;t.style.display='block';clearTimeout(tt);tt=setTimeout(()=>t.style.display='none',2200)}
function cu(){document.querySelectorAll('[data-n]').forEach(e=>{const to=+e.dataset.n,fr=prev[e.id]||0,t0=performance.now();prev[e.id]=to;if(fr==to)return;(function f(t){const k=Math.min(1,(t-t0)/300),v=fr+(to-fr)*(1-Math.pow(1-k,3));e.textContent=money(k<1?Math.round(v):to);if(k<1)requestAnimationFrame(f)})(t0)})}
function tgl(){const r=document.documentElement,cur=r.dataset.theme||'dark';r.dataset.theme=cur=='dark'?'light':'dark';try{localStorage.setItem('bth',r.dataset.theme)}catch(e){}}
try{const t=localStorage.getItem('bth');if(t)document.documentElement.dataset.theme=t}catch(e){}
function ps(rp){try{const h=history.state;if(rp)history.replaceState({tab,view},'');else if(!(h&&h.tab==tab&&h.view==view))history.pushState({tab,view},'')}catch(e){}}
function ct(t){tab=t;view=null;expr='';ord=[];pe='';pph='';armed='';R();scrollTo(0,0);ps()}
function go(v,rp){view=v;expr='';ph='';armed='';R();scrollTo(0,0);ps(rp)}
try{history.replaceState({tab:'b',view:null},'')}catch(e){}
addEventListener('popstate',e=>{const h=e.state||{tab:'b',view:null};tab=h.tab;view=h.view;expr='';ord=[];pe='';pph='';armed='';R();scrollTo(0,0)});
function R(){const p={b:B,s:S,p:Pr,x:X,l:Lp,m:M}[tab];
$('#app').innerHTML=`<header><button class="ib tg" onclick="tgl()">🌗</button><div class="b1">SABBIR</div><div class="b2">Store &amp; Tea Corner</div><div class="mu">${fd(Date.now())}</div></header>`+p();
document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t==tab));bump='';cu();kd()}
function sm(){const t=Date.now(),is=d=>td(d)==td(t),s=sum(db.s.filter(y=>is(y.d))),e=sum(db.x.filter(y=>is(y.d))),c=db.c.reduce((a,u)=>a+sum(u.t.filter(y=>y.k=='p'&&is(y.d))),0);
return `<div class="card hero"><div class="mu">আজকের হাতে নগদ</div><div class="hn">${num('hn',s+c-e)}</div><div class="mu">বিক্রি + বাকি আদায় − খরচ</div><div class="tri"><div><span>বিক্রি</span>${num('t1',s,'g')}</div><div><span>বাকি আদায়</span>${num('t2',c,'g')}</div><div><span>খরচ</span>${num('t3',e,'r')}</div></div></div>`}
/* বাকি */
function B(){if(view==='new')return N();const c=db.c.find(x=>x.id==view);if(c)return V(c);view=null;
const tot=db.c.reduce((s,c)=>s+Math.max(bal(c),0),0),n=db.c.filter(c=>bal(c)>0).length;
return `<div class="card hero"><div class="mu">সবার মোট বাকি</div><div class="hn">${num('bt',tot,'r')}</div><div class="mu">${bn(n)} জনের বাকি আছে</div></div>
<input type="search" placeholder="নাম বা ঠিকানা খুঁজুন" oninput="sq(this.value)"><div class="card" id="ls">${lh(db.c)}</div>
<button class="bt fab" onclick="go('new')">+ নতুন কাস্টমার</button>`}
function lh(l){l=l.slice().sort((a,b)=>bal(b)-bal(a));return l.length?l.map(c=>{const b=bal(c);return `<div class="row" onclick="go(${c.id})">${av(c)}<div class="nm"><b>${esc(c.n)}</b><div class="mu">${esc(c.a||'')}</div></div><b class="${b>0?'r':'g'}">${money(Math.abs(b))}</b></div>`}).join(''):'<div class="mu">কোনো কাস্টমার নেই। নিচের বোতামে চেপে প্রথম কাস্টমার যোগ করুন।</div>'}
function sq(q){$('#ls').innerHTML=lh(db.c.filter(c=>(c.n+' '+(c.a||'')).includes(q)))}
function N(){return `<div class="top"><button class="ib" onclick="go(null)">←</button><h1>নতুন কাস্টমার</h1></div>
<div class="card"><input type="text" id="nn" placeholder="কাস্টমারের নাম"><input type="text" id="na" placeholder="ঠিকানা"><input type="text" id="np" inputmode="tel" placeholder="ফোন নম্বর (না দিলেও চলবে)">
<div class="top"><div class="av" id="pv" style="background:var(--key);color:var(--mu)">ছবি</div><label class="chips" style="margin:0"><span style="border:1px dashed var(--mu);border-radius:14px;padding:10px 14px;cursor:pointer">ছবি তুলুন / বাছুন</span><input type="file" accept="image/*" hidden onchange="pick(this)"></label></div>
<button class="bt" onclick="add()">সংরক্ষণ করুন</button></div>`}
function pick(i){const f=i.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,200/Math.max(im.width,im.height)),cv=document.createElement('canvas');cv.width=im.width*k;cv.height=im.height*k;cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);ph=cv.toDataURL('image/jpeg',.7);$('#pv').innerHTML=`<img src="${ph}" alt="">`};im.src=r.result};r.readAsDataURL(f)}
function add(){const n=$('#nn').value.trim();if(!n)return toast('নাম লিখুন');const id=Date.now();db.c.push({id,n,a:$('#na').value.trim(),f:$('#np').value.trim(),p:ph,t:[]});save();go(id,1)}
const K=['C','⌫','÷','×','7','8','9','−','4','5','6','+','1','2','3','.','0','00','='];
const calc=e=>`<div class="disp"><div id="dsp"></div><div id="res"></div></div><div class="pad">${K.map(k=>`<button class="${'÷×−+='.includes(k)?'op':''} ${k=='='?'w2':''}" onclick="kp('${k}')">${/\d/.test(k)&&!e?bn(k):k}</button>`).join('')}</div>`;
function V(c){const b=bal(c);
const hs=c.t.slice().reverse().map(t=>`<div class="h"><div><b>${t.k=='b'?'বাকি':'শোধ'}</b><div class="mu">${fd(t.d)}</div><div class="mu">${ft(t.d)}</div><button onclick="et(${t.d})">সম্পাদনা</button> &nbsp; <button onclick="dt(${t.d})">${armed==t.d?'আবার চাপুন — মুছে যাবে':'মুছুন'}</button></div><b class="${t.k=='b'?'r':'g'}">${t.k=='b'?'+':'−'} ${money(t.a)}</b></div>`).join('')||'<div class="mu">এখনো কোনো হিসাব নেই।</div>';
const msg=encodeURIComponent(`${c.n}, আপনার চায়ের দোকানের বাকি ${money(Math.max(b,0))}। সুবিধামতো শোধ করবেন, ধন্যবাদ।`);
return `<div class="top"><button class="ib" onclick="go(null)">←</button>${av(c)}<div class="nm"><b>${esc(c.n)}</b><div class="mu">${esc(c.a||'')}</div></div></div>
${c.f?`<div class="chips"><a href="tel:${esc(c.f)}">📞 ফোন করুন</a><a href="sms:${esc(c.f)}?body=${msg}">💬 বাকির মেসেজ</a></div>`:''}
<div class="card hero"><div class="mu">${b<0?'অগ্রিম জমা':'মোট বাকি'}</div><div class="hn">${num('cb',Math.abs(b),b>0?'r':'g')}</div></div>
<div class="card">${calc()}<div class="acts"><button class="bt r2" onclick="tx('b')">বাকি লিখুন</button><button class="bt g2" onclick="tx('p')">বাকি শোধ</button></div></div>
<h3>হিসাবের তালিকা</h3><div class="card">${hs}</div>
<button class="bt ghost" style="color:var(--red)" onclick="dc(${c.id})">${armed=='c'+c.id?'আবার চাপুন — কাস্টমার মুছে যাবে':'কাস্টমার মুছুন'}</button>`}
function ev(){const t=expr.replace(/×/g,'*').replace(/÷/g,'/').replace(/−/g,'-').match(/\d*\.?\d+|[+\-*/]/g);if(!t)return NaN;
let n=[parseFloat(t[0])],o=[];if(isNaN(n[0]))return NaN;
for(let i=1;i<t.length;i+=2){const op=t[i],x=parseFloat(t[i+1]);if(isNaN(x)||!'+-*/'.includes(op))return NaN;
if(op=='*')n[n.length-1]*=x;else if(op=='/')n[n.length-1]/=x;else{o.push(op);n.push(x)}}
let r=n[0];o.forEach((op,i)=>r+=op=='+'?n[i+1]:-n[i+1]);return isFinite(r)?r:NaN}
function kd(){const e=$('#dsp');if(!e)return;const E=tab=='p',f=x=>E?String(x):bn(x);e.textContent=expr?f(expr):f(0);const v=ev();$('#res').textContent=expr&&!isNaN(v)&&/[+\-×÷−]/.test(expr.slice(1))?'= '+f(Math.round(v*100)/100):(E?'Tap a product or type an amount':'টাকার অঙ্ক লিখুন')}
function kp(k){if(k=='C'){expr='';if(tab=='p'){ord=[];$('#ord').innerHTML=oh();$('#pgrid').innerHTML=pgh()}}else if(k=='⌫')expr=expr.slice(0,-1);else if(k=='='){const v=ev();if(!isNaN(v))expr=String(Math.round(v*100)/100)}
else if('÷×−+'.includes(k)){if(expr)expr=('÷×−+'.includes(expr.slice(-1))?expr.slice(0,-1):expr)+k}
else expr+=k;kd()}
function tx(k){const v=ev();if(isNaN(v)||v<=0)return toast('সঠিক টাকার অঙ্ক লিখুন');const c=db.c.find(x=>x.id==view);c.t.push({k,a:Math.round(v*100)/100,d:Date.now()});save();expr='';armed='';R();toast(k=='b'?'বাকি লেখা হয়েছে':'শোধ লেখা হয়েছে')}
function dt(d){if(armed!=d){armed=String(d);return R()}const c=db.c.find(x=>x.id==view);c.t=c.t.filter(t=>t.d!=d);armed='';save();R()}
function dc(id){if(armed!='c'+id){armed='c'+id;return R()}db.c=db.c.filter(x=>x.id!=id);save();go(null,1)}
/* বিক্রি */
function S(){const t=Date.now(),cnt=n=>db.s.filter(x=>x.i==n&&td(x.d)==td(t)).length;
return sm()+`<h3>ট্যাপ করে বিক্রি লিখুন</h3><div class="items">${db.it.map((i,k)=>`<button class="it ${bump==i.n?'bump':''}" onclick="sell(${k})"><span>${esc(i.n)}</span><b>${money(i.p)}</b><i>${bn(cnt(i.n))}</i></button>`).join('')}</div>
<button class="bt ghost" onclick="undo()">↩ শেষ বিক্রি বাতিল</button>
<h3>আজকের বিক্রির তালিকা</h3><div class="card">${sl()}</div><details class="card"><summary>আইটেম যোগ / মুছুন</summary><div class="two"><input type="text" id="in" placeholder="নাম (যেমন: লাচ্ছি)"><input type="text" id="ip" inputmode="decimal" placeholder="দাম"></div><button class="bt" onclick="ai()">যোগ করুন</button>${db.it.map((i,k)=>`<div class="h"><span>${esc(i.n)} · ${money(i.p)}</span><button onclick="ei(${k})">সম্পাদনা</button> &nbsp; <button onclick="di(${k})">মুছুন</button></div>`).join('')}</details>`}
function sell(k){const i=db.it[k];db.s.push({i:i.n,a:i.p,d:Date.now()});bump=i.n;save();R()}
function undo(){if(!db.s.length)return toast('বাতিল করার মতো কিছু নেই');db.s.pop();save();R()}
function ai(){const n=$('#in').value.trim(),p=parseFloat($('#ip').value);if(!n||isNaN(p))return toast('নাম ও দাম লিখুন');db.it.push({n,p});save();R()}
function di(k){db.it.splice(k,1);save();R()}
/* খরচ */
function X(){const e=db.x.filter(y=>td(y.d)==td(Date.now())).reverse();
return sm()+`<div class="card"><input type="text" id="xn" placeholder="কীসের খরচ?"><div class="chips">${['দুধ','চিনি','চা পাতা','গ্যাস','ভাড়া'].map(n=>`<button onclick="$('#xn').value='${n}'">${n}</button>`).join('')}</div>${calc()}<button class="bt r2" onclick="ex()">খরচ লিখুন</button></div>
<h3>আজকের খরচ</h3><div class="card">${e.map(y=>`<div class="h"><div><b>${esc(y.n)}</b><div class="mu">${ft(y.d)}</div><button onclick="ee(${y.d})">সম্পাদনা</button> &nbsp; <button onclick="dx(${y.d})">মুছুন</button></div><b class="r">${money(y.a)}</b></div>`).join('')||'<div class="mu">আজ এখনো কোনো খরচ লেখা হয়নি।</div>'}</div>`}
function ex(){const v=ev();if(isNaN(v)||v<=0)return toast('সঠিক টাকার অঙ্ক লিখুন');db.x.push({a:Math.round(v*100)/100,n:$('#xn').value.trim()||'খরচ',d:Date.now()});save();expr='';R();toast('খরচ লেখা হয়েছে')}
function dx(d){db.x=db.x.filter(y=>y.d!=d);save();R()}
/* amount editing */
let mcb;function em(t,v,cb){mcb=cb;$('#mb').innerHTML=`<b>${t}</b><input type="text" id="mv" inputmode="decimal" value="${v}" style="margin:10px 0" onkeydown="if(event.key=='Enter')ms()"><div class="acts"><button class="bt ghost" onclick="mx()">বাতিল</button><button class="bt" onclick="ms()">সংরক্ষণ</button></div>`;$('#md').style.display='flex';setTimeout(()=>{const i=$('#mv');i.focus();i.select()},50)}
function mx(){$('#md').style.display='none'}
function ms(){const v=parseFloat($('#mv').value.replace(/[০-৯]/g,d=>'০১২৩৪৫৬৭৮৯'.indexOf(d)));if(isNaN(v)||v<=0)return toast('সঠিক টাকার অঙ্ক লিখুন');mx();mcb(Math.round(v*100)/100)}
function et(d){const t=db.c.find(x=>x.id==view).t.find(x=>x.d==d);em('টাকার অঙ্ক বদলান',t.a,v=>{t.a=v;save();R();toast('বদলানো হয়েছে')})}
function ee(d){const y=db.x.find(z=>z.d==d);em('খরচের অঙ্ক বদলান',y.a,v=>{y.a=v;save();R();toast('বদলানো হয়েছে')})}
function es(d){const y=db.s.find(z=>z.d==d);em('বিক্রির অঙ্ক বদলান',y.a,v=>{y.a=v;save();R();toast('বদলানো হয়েছে')})}
function ds(d){db.s=db.s.filter(y=>y.d!=d);save();R()}
function ei(k){const i=db.it[k];em(i.n+' — দাম বদলান',i.p,v=>{i.p=v;save();R();toast('বদলানো হয়েছে')})}
function sl(){const l=db.s.filter(y=>td(y.d)==td(Date.now())).slice(-30).reverse();return l.map(y=>`<div class="h"><div><b>${esc(y.i)}</b><div class="mu">${ft(y.d)}</div><button onclick="es(${y.d})">সম্পাদনা</button> &nbsp; <button onclick="ds(${y.d})">মুছুন</button></div><b class="g">${money(y.a)}</b></div>`).join('')||'<div class="mu">আজ এখনো কোনো বিক্রি নেই।</div>'}
/* Products */
const en=n=>'৳ '+(Math.round(n*100)/100);
function oh(){const m={};ord.forEach(p=>{m[p.k]=m[p.k]||{n:p.n,q:0};m[p.k].q++});const a=Object.values(m),hp=ord.some(p=>p.bp!=null),pf=ord.reduce((t,p)=>t+(p.bp!=null?p.sp-p.bp:0),0);
return a.length?a.map(x=>`<span>${esc(x.n)} × ${x.q}</span>`).join('')+(hp?`<span>Est. profit ${en(pf)}</span>`:''):'<span class="mu">No items selected</span>'}
function pgh(){const q=id=>ord.filter(p=>p.k==id).length;
return db.pr.length?db.pr.map(p=>`<button class="it" onclick="pt(${p.id})">${p.ph?`<img class="pi" src="${p.ph}" alt="">`:''}<span>${esc(p.n||'Item')}</span><b>${p.sp!=null?en(p.sp):'—'}</b>${p.bp!=null?`<small>Cost ${en(p.bp)}</small>`:''}<i>${q(p.id)||''}</i></button>`).join(''):'<div class="mu" style="grid-column:1/-1">No products yet. Add your first one below.</div>'}
function Pr(){const f=db.pr.find(x=>x.id==pe)||{};
return `<h3 style="margin-top:4px">Tap products to add</h3><div class="items" id="pgrid">${pgh()}</div>
<div class="card"><div class="ord" id="ord">${oh()}</div>${calc(1)}<div class="acts"><button class="bt ghost" onclick="kp('C')">Clear</button><button class="bt g2" onclick="rec()">Record sale</button></div></div>
<details class="card" ${pe?'open':''}><summary>${pe?'Edit product':'Add product'} <span class="mu">(all fields optional)</span></summary><input type="text" id="pn" placeholder="Name (e.g. Samosa)" value="${esc(f.n||'')}"><div class="top"><div class="av" id="ppv" style="background:var(--key);color:var(--mu);border-radius:12px">${pph?`<img src="${pph}" alt="">`:'Photo'}</div><label class="chips" style="margin:0"><span style="border:1px dashed var(--mu);border-radius:14px;padding:8px 12px;cursor:pointer">Add photo</span><input type="file" accept="image/*" hidden onchange="ppick(this)"></label><span class="chips" style="margin:0"><button onclick="pph='';$('#ppv').textContent='Photo'">Remove</button></span></div><div class="two3"><input type="text" id="ps" inputmode="decimal" placeholder="Selling price" value="${f.sp??''}"><input type="text" id="pb" inputmode="decimal" placeholder="Buying price" value="${f.bp??''}"></div><button class="bt" onclick="ap()">${pe?'Save changes':'Add product'}</button></details>
${db.pr.length?`<div class="card"><b>Manage products</b>${db.pr.map(p=>`<div class="h"><span>${esc(p.n||'Item')}</span><span><button onclick="ep(${p.id})">Edit</button> &nbsp; <button onclick="dp(${p.id})">Delete</button></span></div>`).join('')}</div>`:''}`}
function pt(id){const p=db.pr.find(x=>x.id==id);if(p.sp==null)return toast('No selling price set for this item');ord.push({k:p.id,n:p.n||'Item',sp:p.sp,bp:p.bp});expr=expr?(/[+\-×÷−]$/.test(expr)?expr:expr+'+')+p.sp:String(p.sp);kd();$('#pgrid').innerHTML=pgh();$('#ord').innerHTML=oh()}
function ap(){const g=v=>{v=parseFloat(v);return isNaN(v)?null:v},n=$('#pn').value.trim(),sp=g($('#ps').value),bp=g($('#pb').value);
if(!n&&sp==null&&bp==null&&!pph)return toast('Enter at least one detail');
if(pe){Object.assign(db.pr.find(x=>x.id==pe),{n,sp,bp,ph:pph});pe=''}else db.pr.push({id:Date.now(),n,sp,bp,ph:pph});pph='';save();R();toast('Saved')}
function ep(id){pe=id;pph=(db.pr.find(x=>x.id==id)||{}).ph||'';R();$('#pn').scrollIntoView({block:'center'})}
function ppick(i){const f=i.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,160/Math.max(im.width,im.height)),cv=document.createElement('canvas');cv.width=im.width*k;cv.height=im.height*k;cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);pph=cv.toDataURL('image/jpeg',.7);$('#ppv').innerHTML=`<img src="${pph}" alt="">`};im.src=r.result};r.readAsDataURL(f)}
function dp(id){db.pr=db.pr.filter(x=>x.id!=id);ord=ord.filter(p=>p.k!=id);if(pe==id)pe='';save();R()}
function rec(){if(!ord.length)return toast('Select products first');const t=Date.now();ord.forEach((p,k)=>db.s.push({i:p.n,a:p.sp,d:t+k}));save();ord=[];expr='';R();toast('Sale recorded in Today')}
/* কেনাকাটার তালিকা */
function Lp(){const dn=db.l.filter(x=>x.d).length;
return `<div class="card"><div class="two" style="grid-template-columns:3fr 1fr"><input type="text" id="li" placeholder="কী কিনতে হবে?" onkeydown="if(event.key=='Enter')al()"><button class="bt" style="margin-bottom:10px" onclick="al()">যোগ</button></div>
${db.l.map((x,k)=>`<div class="h ck"><input type="checkbox" ${x.d?'checked':''} onchange="tl(${k})"><span class="${x.d?'dn':''}">${esc(x.n)}</span><button onclick="rl(${k})">✕</button></div>`).join('')||'<div class="mu">তালিকা খালি। দুধ, চিনি, চা পাতা — যা শেষ হয়ে আসছে লিখে রাখুন।</div>'}</div>
${dn?`<button class="bt ghost" onclick="cl()">কেনা হয়েছে এমন ${bn(dn)}টি মুছুন</button>`:''}`}
function al(){const n=$('#li').value.trim();if(!n)return;db.l.push({n,d:0});save();R();$('#li').focus()}
function tl(k){db.l[k].d=db.l[k].d?0:1;save();R()}
function rl(k){db.l.splice(k,1);save();R()}
function cl(){db.l=db.l.filter(x=>!x.d);save();R()}
/* আরও */
function M(){return `<div class="card"><b>ব্যাকআপ ও ফেরত আনা</b><p class="mu">তথ্য এই ফোনের ব্রাউজারেই জমা থাকে। মাঝে মাঝে ব্যাকআপ নিয়ে নিজেকে হোয়াটসঅ্যাপে পাঠিয়ে রাখুন। নতুন ফোনে সেই লেখা এখানে পেস্ট করে ফেরত আনুন।</p>
<textarea id="bk" rows="5" placeholder="ব্যাকআপ লেখা এখানে আসবে। ফেরত আনতে এখানে পেস্ট করুন।"></textarea>
<div class="acts"><button class="bt" onclick="mkb()">ব্যাকআপ নিন</button><button class="bt ghost" onclick="rsb()">ফেরত আনুন</button></div></div>
<div class="card"><b>থিম</b><p class="mu">দিন বা রাতের মতো করে রং বদলান।</p><button class="bt ghost" onclick="tgl()">🌗 থিম বদলান</button></div>`}
function mkb(){const t=JSON.stringify(db),a=$('#bk');a.value=t;a.select();try{navigator.clipboard.writeText(t).then(()=>toast('কপি হয়েছে'),()=>toast('লেখাটি সিলেক্ট করা আছে, কপি করুন'))}catch(e){toast('লেখাটি সিলেক্ট করা আছে, কপি করুন')}}
function rsb(){try{const j=JSON.parse($('#bk').value);if(!Array.isArray(j.c))throw 0;db=Object.assign({},D0,j);save();toast('ফেরত আনা হয়েছে');ct('b')}catch(e){toast('সঠিক ব্যাকআপ লেখা পেস্ট করুন')}}
R();
</script><script>if('serviceWorker' in navigator&&location.protocol.indexOf('http')==0)navigator.serviceWorker.register('sw.js').catch(function(){});</script></body></html>
